<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Buscador iTunes</title>
</head>
<link rel="stylesheet" href="style.css">

<body>
    <div class="main">
        <h2>Buscador de música (iTunes API)</h2>

        <input type="text" id="searchInput" placeholder="Escribe un artista o canción">
        <button id="searchBtn">Buscar</button>

        <ul id="results"></ul>
    </div>
    <footer>
        <!--footer siempre debe estar al final del body-->
        <p>Datos obtenidos de la API pública de iTunes.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
