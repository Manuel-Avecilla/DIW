<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animate CSS</title>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <link rel="stylesheet" href="style.css"/>
    <script type="text/javascript" src="main.js"></script>

</head>
<body>
    
    <h1>Animate CSS</h1>
    <div class="container">
        <h2 id="texto" class="animate__animated">Pulsa el boton para animar este texto</h2>
        <div class="botones">
            <button onclick="addAttentionSeekers()">Attention seekers</button>
            <button onclick="addAlert()">Attention seekers</button>
            <button onclick="addEntrance()">Back entrances</button>
            <button onclick="addExit()">Back exits</button>
            <button onclick="addBouncingEntrance()">Bouncing entrances</button>
            <button onclick="addFadingEntrance()">Fading entrances</button>
            <button onclick="addFadingExit()">Fading exits</button>
            <button onclick="addFlipper()">Flippers</button>
            <button onclick="addRotatingEntrance()">Rotating entrances</button>
            <button onclick="addRotatingExit()">Rotating exits</button>
            <button onclick="addSpecial()">Specials</button>
            <button onclick="addZoomingEntrance()">Zooming entrances</button>
            <button onclick="addZoomingExit()">Zooming exits</button>
            <button onclick="addSlidingEntrance()">Sliding entrances</button>
            <button onclick="addSlidingExit()">Sliding exits</button>
        </div>

    </div>

</body>
</html>
